# Broker de PRUEBAS local (Docker). Para internet usa EMQX Cloud (TLS 8883) como en la guía del curso.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
# retain deshabilitado a nivel de broker: una alarma antigua nunca reaparece al suscribirse
retain_available false
persistence false
